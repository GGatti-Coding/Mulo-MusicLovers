<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Mulo Music Player - Phase 3 UI Mock-Up
    Team: Music Lovers (Group 10)
    Jonah Rideout, Ahmed Yassine Messaoudi, Simon Waites,
    Guilherme Gatti, Jon Ibarlin
    Page: Home
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mulo - Home</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <main>

      <header class="page-header">
        <div>
          <p class="eyebrow">Mulo</p>
          <h1 class="page-title">Good evening</h1>
          <p class="page-subtitle">What do you want to listen to?</p>
        </div>
        <button class="icon-button" type="button" aria-label="Profile">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </header>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Your playlists</h2>
          <button class="text-button" type="button">See all</button>
        </div>
        <div class="tile-grid">
          <a class="tile" href="library.html">
            <div class="tile-art art-1">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <p class="tile-title">Late Night Drive</p>
            <p class="tile-meta">24 songs</p>
          </a>
          <a class="tile" href="library.html">
            <div class="tile-art art-2">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <p class="tile-title">Study Focus</p>
            <p class="tile-meta">18 songs</p>
          </a>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Trending now</h2>
          <button class="text-button" type="button">See all</button>
        </div>
        <div class="song-list">

          <div class="song-row">
            <a class="song-link" href="now-playing.html">
              <div class="song-art art-3">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
              <div class="song-text">
                <p class="song-title">Levitating</p>
                <p class="song-artist">Dua Lipa</p>
              </div>
            </a>
            <button class="more-button" type="button" aria-label="More options for Levitating">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5" cy="12" r="1.6"/>
                <circle cx="12" cy="12" r="1.6"/>
                <circle cx="19" cy="12" r="1.6"/>
              </svg>
            </button>
          </div>

          <div class="song-row">
            <a class="song-link" href="now-playing.html">
              <div class="song-art art-4">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
              <div class="song-text">
                <p class="song-title">As It Was</p>
                <p class="song-artist">Harry Styles</p>
              </div>
            </a>
            <button class="more-button" type="button" aria-label="More options for As It Was">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5" cy="12" r="1.6"/>
                <circle cx="12" cy="12" r="1.6"/>
                <circle cx="19" cy="12" r="1.6"/>
              </svg>
            </button>
          </div>

        </div>
      </section>

    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <a class="tab-item active" href="index.html" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <a class="tab-item" href="search.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Search
      </a>
      <a class="tab-item" href="community.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Community
      </a>
      <a class="tab-item" href="library.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="4" x2="5" y2="20"/>
          <line x1="10" y1="4" x2="10" y2="20"/>
          <path d="M15 4l5 16"/>
        </svg>
        Library
      </a>
    </nav>
  </div>
</body>
</html>
