<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Mulo Music Player - Phase 3 UI Mock-Up
    Team: Music Lovers (Group 10)
    Jonah Rideout, Ahmed Yassine Messaoudi, Simon Waites,
    Guilherme Gatti, Jon Ibarlin
    Page: Community
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mulo - Community</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <main>

      <header class="page-header">
        <div>
          <p class="eyebrow">Mulo</p>
          <h1 class="page-title">Community</h1>
          <p class="page-subtitle">See what your friends are sharing.</p>
        </div>
        <button class="icon-button" type="button" aria-label="Profile">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </header>

      <button class="btn btn-spaced" type="button">Share a song</button>

      <article class="post">
        <div class="post-author">
          <div class="avatar avatar-blue">JR</div>
          <div>
            <p class="post-name">Jonah R.</p>
            <p class="post-time">shared a song · 2h</p>
          </div>
        </div>
        <p class="post-quote">"Perfect for the drive home."</p>
        <div class="song-row">
          <a class="song-link" href="now-playing.html">
            <div class="song-art art-3">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <div class="song-text">
              <p class="song-title">Levitating</p>
              <p class="song-artist">Dua Lipa</p>
            </div>
          </a>
          <button class="more-button" type="button" aria-label="More options for Levitating">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1.6"/>
              <circle cx="12" cy="12" r="1.6"/>
              <circle cx="19" cy="12" r="1.6"/>
            </svg>
          </button>
        </div>
        <div class="post-actions">
          <button class="action-btn" type="button" aria-label="Like, 24 likes">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="fill: var(--accent); stroke: var(--accent)">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            24
          </button>
          <button class="action-btn" type="button" aria-label="Comments, 5 comments">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            5
          </button>
        </div>
      </article>

      <article class="post">
        <div class="post-author">
          <div class="avatar avatar-pink">SW</div>
          <div>
            <p class="post-name">Simon W.</p>
            <p class="post-time">shared a song · 5h</p>
          </div>
        </div>
        <p class="post-quote">"On repeat all week."</p>
        <div class="song-row">
          <a class="song-link" href="now-playing.html">
            <div class="song-art art-12">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <div class="song-text">
              <p class="song-title">Flowers</p>
              <p class="song-artist">Miley Cyrus</p>
            </div>
          </a>
          <button class="more-button" type="button" aria-label="More options for Flowers">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1.6"/>
              <circle cx="12" cy="12" r="1.6"/>
              <circle cx="19" cy="12" r="1.6"/>
            </svg>
          </button>
        </div>
        <div class="post-actions">
          <button class="action-btn" type="button" aria-label="Like, 18 likes">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="fill: var(--accent); stroke: var(--accent)">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            18
          </button>
          <button class="action-btn" type="button" aria-label="Comments, 3 comments">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            3
          </button>
        </div>
      </article>

    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <a class="tab-item" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <a class="tab-item" href="search.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Search
      </a>
      <a class="tab-item active" href="community.html" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Community
      </a>
      <a class="tab-item" href="library.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="4" x2="5" y2="20"/>
          <line x1="10" y1="4" x2="10" y2="20"/>
          <path d="M15 4l5 16"/>
        </svg>
        Library
      </a>
    </nav>
  </div>
</body>
</html>
